<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SEAL — settings</title>
    <link rel="stylesheet" href="popup.css" />
    <style>body { width: 460px; }</style>
  </head>
  <body>
    <header><span class="mark">SEAL</span><span class="sub">settings</span></header>
    <main>
      <label>SEAL server<input id="url" placeholder="http://localhost:4000" /></label>
      <p class="muted">
        Where the authorization ledger lives. The extension talks only to this host, and never sends
        message contents anywhere else — media is hashed on this machine and only the digest is
        submitted.
      </p>
      <button class="btn primary" id="save">Save</button>
      <p class="muted" id="saved" hidden>Saved.</p>
    </main>
    <script src="options.js"></script>
  </body>
</html>
